<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sistema Solar 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #050505; }
  </style>
</head>
<body>
  <!-- Importando a biblioteca Three.js e os Controles de Câmera -->
  <script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.128.0';
    import { OrbitControls } from 'https://cdn.skypack.dev/three@0.128.0/examples/jsm/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Controles para permitir arrastar a tela com o mouse
    const controls = new OrbitControls(camera, renderer.domElement);

    // Iluminação espacial
    scene.add(new THREE.AmbientLight(0xffffff, 0.2));
    const pointLight = new THREE.PointLight(0xffee88, 2, 100);
    scene.add(pointLight);

    // Fundo de Estrelas
    const starGeo = new THREE.BufferGeometry();
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
    const starVertices = [];
    for(let i=0; i<3000; i++) {
      starVertices.push((Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200);
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
    scene.add(new THREE.Points(starGeo, starMat));

    // O Sol
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(4, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xffcc00 })
    );
    scene.add(sun);

    // Dados dos Planetas
    const planetsData = [
      { radius: 0.4, distance: 8, color: 0xaaaaaa, speed: 0.04 },  // Mercúrio
      { radius: 0.9, distance: 12, color: 0xffcc66, speed: 0.015 }, // Vênus
      { radius: 1.0, distance: 16, color: 0x2266ff, speed: 0.01 },  // Terra
      { radius: 0.5, distance: 20, color: 0xff4422, speed: 0.008 }, // Marte
      { radius: 2.5, distance: 28, color: 0xcca266, speed: 0.002 }, // Júpiter
      { radius: 2.0, distance: 36, color: 0xeebb88, speed: 0.001 }  // Saturno
    ];

    const planets = [];
    planetsData.forEach(data => {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(data.radius, 32, 32),
        new THREE.MeshStandardMaterial({ color: data.color })
      );
      // Posição inicial aleatória na órbita
      mesh.userData = { distance: data.distance, speed: data.speed, angle: Math.random() * Math.PI * 2 };
      scene.add(mesh);
      planets.push(mesh);
    });

    camera.position.set(0, 20, 40);
    controls.update();

    // Motor de Animação
    function animate() {
      requestAnimationFrame(animate);
      
      planets.forEach(planet => {
        planet.userData.angle += planet.userData.speed;
        // Atualiza a posição X e Z usando trigonometria
        planet.position.x = Math.cos(planet.userData.angle) * planet.userData.distance;
        planet.position.z = Math.sin(planet.userData.angle) * planet.userData.distance;
        planet.rotation.y += 0.01; // Rotação do planeta em seu próprio eixo
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Redimensionamento automático ao mudar o tamanho da janela
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
